[platformio]
default_envs = metroboard_public

[env:metroboard_public]
; Keep the Arduino 2.0.17 / ESP-IDF 4.4.7 generation used by deployed boards.
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = COM17
monitor_port = COM17
board_build.partitions = min_spiffs.csv
build_src_filter = +<main.cpp> -<bridge.cpp>
lib_deps =
    WiFi
    WiFiClientSecure
    HTTPClient
    WebServer
    DNSServer
    Preferences
    Update
    adafruit/Adafruit NeoPixel@^1.12.3
    bblanchon/ArduinoJson@^6.21.5
extra_scripts =
    post:scripts/pio_copy_firmware.py

[env:metroboard_bridge]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = min_spiffs.csv
build_src_filter = +<bridge.cpp> -<main.cpp>
lib_deps =
    WiFi
    WiFiClientSecure
    HTTPClient
    Preferences
    Update
    bblanchon/ArduinoJson@^6.21.5
