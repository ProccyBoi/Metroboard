[platformio]
default_envs = metroboard_public

[env:metroboard_public]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = COM17
monitor_port = COM17
board_build.partitions = min_spiffs.csv
lib_deps =
    WiFi
    WiFiClientSecure
    HTTPClient
    WebServer
    DNSServer
    Preferences
    Update
    adafruit/Adafruit NeoPixel@^1.12.3
    bblanchon/ArduinoJson@^6.21.5
extra_scripts =
    post:scripts/pio_copy_firmware.py
